name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run non-ML test suite
        run: |
          for test_path in tests/test_*.py; do
            test_file="${test_path##*/}"
            if [ "$test_file" = "test_baseline.py" ]; then
              continue
            fi
            python -m unittest discover -s tests -p "$test_file" -v
          done

  baseline:
    name: ML baseline · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and ML test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[ml]'

      - name: Run ML baseline test
        run: python -m unittest discover -s tests -p 'test_baseline.py' -v
