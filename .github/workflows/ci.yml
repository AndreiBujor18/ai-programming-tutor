name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  worker-image:
    name: Disposable worker image
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build the reference worker image
        run: docker build --file worker/Dockerfile --tag aptutor-worker:ci .

      - name: Run one source-free worker smoke test
        run: |
          export PYTHONPATH=src
          python - <<'PY'
          from pathlib import Path
          from ai_programming_tutor.catalog import get_exercise

          Path("/tmp/aptutor-reference.c").write_text(
              get_exercise("sentinel_average").reference_solution,
              encoding="utf-8",
          )
          PY
          worker_image="$(docker image inspect aptutor-worker:ci --format '{{.Id}}')"
          python -m ai_programming_tutor.cli run-isolated sentinel_average \
            /tmp/aptutor-reference.c \
            --image "$worker_image" \
            --output /tmp/aptutor-worker-result.json >/tmp/aptutor-worker-stdout.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/aptutor-worker-result.json").read_text())
          assert result["signals"] == {
              "compiled": True,
              "passed_count": 5,
              "total_count": 5,
              "test_statuses": ["passed"] * 5,
          }
          serialized = json.dumps(result)
          assert "source" not in result
          assert "stderr" not in serialized
          assert "actual" not in serialized
          PY

  web-assets:
    name: Web editor bundle
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked web build dependencies
        run: npm ci

      - name: Verify the committed editor bundle
        run: npm run check:editor

  core:
    name: Core · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: python -m pip install --disable-pip-version-check -e .

      - name: Run non-ML test suite
        run: |
          for test_path in tests/test_*.py; do
            test_file="${test_path##*/}"
            if [ "$test_file" = "test_baseline.py" ]; then
              continue
            fi
            python -m unittest discover -s tests -p "$test_file" -v
          done

  baseline:
    name: ML baseline · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and ML test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[ml]'

      - name: Run ML baseline test
        run: python -m unittest discover -s tests -p 'test_baseline.py' -v
