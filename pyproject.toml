[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-programming-tutor"
version = "0.10.0"
description = "A local C tutor with progressive hints and privacy-preserving style profiles."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ml = [
  "joblib>=1.3",
  "scikit-learn>=1.4",
]
api = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
aptutor = "ai_programming_tutor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_programming_tutor = [
  "exercises/*/*.json",
  "exercises/*/*.c",
  "web/*.html",
  "web/*.css",
  "web/*.js",
]

[tool.ruff]
line-length = 100
target-version = "py311"
